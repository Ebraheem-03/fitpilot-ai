name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token (M0 security review).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @fitpilot/web build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    # Same image as docker-compose.yml so integration tests run against the real engine.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fitpilot
          POSTGRES_PASSWORD: fitpilot
          POSTGRES_DB: fitpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitpilot"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fitpilot:fitpilot@localhost:5432/fitpilot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  e2e:
    needs: web-and-packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: services/api
      - run: pnpm --filter @fitpilot/web exec playwright install --with-deps chromium
      # Local Supabase stack (Docker) with a job-generated ES256 key; no repository secrets (ADR-0003).
      - run: scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
